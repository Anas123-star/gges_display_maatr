<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AAQMS Display</title>
<style>
  /* ── Exact 96x64 canvas, no scroll, no scaling ─────────────────────── */
  html, body {
    margin: 0;
    padding: 0;
    width: 96px;
    height: 64px;
    background: #000000;
    overflow: hidden;
  }

  * { box-sizing: border-box; }

  .screen {
    width: 96px;
    height: 64px;
    background: #000;
    font-family: 'Courier New', 'Consolas', monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Title bar: 10px tall (matches TableFormat's isTinyDisplay floor) ── */
  .title-bar {
    height: 10px;
    flex-shrink: 0;
    border-bottom: 1px solid #333;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    padding: 0 2px;
  }

  .title-track {
    position: absolute;
    left: 0;
    white-space: nowrap;
    color: #ff3b3b;         /* flat color, no glow — reads clean on real LEDs */
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.3px;
    line-height: 1;
    animation: scroll-title 9s linear infinite;
  }

  @keyframes scroll-title {
    0%   { transform: translateX(96px); }
    100% { transform: translateX(-100%); }
  }

  /* ── Date/time bar: 10px tall ─────────────────────────────────────── */
  .datetime {
    height: 10px;
    flex-shrink: 0;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
  }

  .datetime .date,
  .datetime .time {
    flex: 1;
    padding: 0 2px;
    color: #ffffff;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
  }

  .datetime .date {
    font-size: 6px;
    text-align: left;
  }

  .datetime .time {
    font-size: 7px;
    text-align: right;
  }

  .datetime .sep {
    width: 1px;
    height: 10px;
    background: #333;
    flex-shrink: 0;
  }

  /* ── Rows area: remaining 44px, split evenly across 4 sensors = 11px/row */
  .rows {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    height: 11px;
    border-bottom: 1px solid #222;
    overflow: hidden;
  }

  .row:last-child { border-bottom: none; }

  .label {
    width: 34%;
    color: #33ff33;
    font-size: 7px;
    font-weight: 700;
    padding: 0 2px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
  }

  .value {
    width: 32%;
    color: #29b6f6;
    font-size: 7px;
    font-weight: 800;
    text-align: center;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
  }

  .unit {
    width: 34%;
    color: #29b6f6;
    font-size: 5px;
    text-align: right;
    padding: 0 2px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="screen" id="screen">
    <div class="title-bar">
      <div class="title-track" id="title">MAATR BIZBAY&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;MAATR ICON&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;</div>
    </div>

    <div class="datetime">
      <span class="date" id="date">--/--/----</span>
      <span class="sep"></span>
      <span class="time" id="time">--:--</span>
    </div>

    <div class="rows" id="rows">
      <div class="row"><span class="label">PM2.5</span><span class="value" id="pm25">--</span><span class="unit">ug/m3</span></div>
      <div class="row"><span class="label">PM10</span><span class="value" id="pm10">--</span><span class="unit">ug/m3</span></div>
      <div class="row"><span class="label">TEMP</span><span class="value" id="temp">--</span><span class="unit">C</span></div>
      <div class="row"><span class="label">HUM</span><span class="value" id="hum">--</span><span class="unit">%</span></div>
    </div>
  </div>

  <script>
    // ---- CONFIGURE THIS ---------------------------------------------------
    // No API, no fetching — every value is a random number picked from the
    // ranges below, refreshed once a minute.
    const REFRESH_MS = 60000; // 1 minute

    const RANGES = {
      pm25: { min: 25, max: 30, decimals: 0 },
      pm10: { min: 30, max: 35, decimals: 0 },
      temp: { min: 27, max: 29, decimals: 1 },
      hum:  { min: 55, max: 60, decimals: 1 }
    };
    // -------------------------------------------------------------------------

    const el = {
      date: document.getElementById('date'),
      time: document.getElementById('time'),
      pm25: document.getElementById('pm25'),
      pm10: document.getElementById('pm10'),
      temp: document.getElementById('temp'),
      hum:  document.getElementById('hum')
    };

    function randomInRange(min, max, decimals) {
      const val = Math.random() * (max - min) + min;
      return val.toFixed(decimals);
    }

    function updateDateTime() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const yyyy = d.getFullYear();
      let hh = d.getHours();
      const mi = String(d.getMinutes()).padStart(2, "0");
      const ampm = hh >= 12 ? "PM" : "AM";
      hh = hh % 12 || 12;
      el.date.textContent = `${dd}/${mm}/${yyyy}`;
      el.time.textContent = `${String(hh).padStart(2, "0")}:${mi}${ampm}`;
    }

    function updateReadings() {
      el.pm25.textContent = randomInRange(RANGES.pm25.min, RANGES.pm25.max, RANGES.pm25.decimals);
      el.pm10.textContent = randomInRange(RANGES.pm10.min, RANGES.pm10.max, RANGES.pm10.decimals);
      el.temp.textContent = randomInRange(RANGES.temp.min, RANGES.temp.max, RANGES.temp.decimals);
      el.hum.textContent  = randomInRange(RANGES.hum.min,  RANGES.hum.max,  RANGES.hum.decimals);
    }

    updateReadings();
    setInterval(updateReadings, REFRESH_MS);

    updateDateTime();
    setInterval(updateDateTime, 1000); // clock ticks every second, values every minute
  </script>
</body>
</html>
